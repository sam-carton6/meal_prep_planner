<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Meal Bank Mockup</title>
<!-- Clickable MOCKUP of the meal-bank rework (3 Nov 2026). Fake data, nothing is saved. Not the real app. -->
<style>
:root {
  --bg: #ffffff; --fg: #1d2420; --muted: #66716b; --line: #e3e8e5; --accent: #2f6f4f; --field: #f2f5f3;
  --warn: #b9770e; --cook: #8a4fbf; --sel: #2f6f4f22;
  color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #121614; --fg: #e7ece9; --muted: #9aa59f; --line: #2a322e; --accent: #7cc4a0; --field: #1d2421;
    --warn: #e0a84a; --cook: #c49bea; --sel: #7cc4a033; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); }
button { font: inherit; color: inherit; cursor: pointer; }
.banner { background: var(--warn); color: #000; font-size: 0.78rem; text-align: center; padding: 4px 8px; }
.layout { display: flex; flex-direction: column; }
.main { padding: 0 12px 220px; max-width: 1400px; width: 100%; margin: 0 auto; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 8px 0 6px; border-bottom: 1px solid var(--line); }
.seg { display: flex; gap: 4px; }
.seg button { flex: 1; padding: 7px; border: 1px solid var(--line); border-radius: 9px; background: var(--field); }
.seg button.on { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.nav { display: flex; justify-content: space-between; align-items: center; margin: 6px 0 2px; }
.nav b { font-size: 1rem; }
.nav button { background: none; border: none; color: var(--accent); }
.totals { display: flex; gap: 10px; font-size: 0.8rem; color: var(--muted); flex-wrap: wrap; }
.totals .ok { color: var(--accent); font-weight: 600; } .totals .off { color: var(--warn); font-weight: 600; }
.hint { font-size: 0.82rem; background: var(--sel); border-radius: 8px; padding: 6px 8px; margin-top: 6px; }
.days { display: grid; gap: 8px; margin-top: 8px; }
.day { border: 1px solid var(--line); border-radius: 12px; padding: 6px 8px; }
.day.today { border-color: var(--accent); }
.day-h { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.day-h .t { font-size: 0.78rem; color: var(--muted); }
.cookbtn { font-size: 0.75rem; border: 1px dashed var(--line); background: none; border-radius: 8px; padding: 2px 8px; color: var(--muted); }
.cooktag { font-size: 0.75rem; background: var(--cook); color: var(--bg); border-radius: 8px; padding: 2px 8px; border: none; }
.slot { display: flex; gap: 6px; align-items: center; min-height: 34px; border-radius: 8px; padding: 2px 4px; margin: 2px -4px; }
.slot .sn { width: 66px; flex: none; font-size: 0.75rem; color: var(--muted); }
.slot .es { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; }
.placing .slot { outline: 1.5px dashed var(--accent); outline-offset: -1px; }
.slot.dragover { background: var(--sel); }
.chip { font-size: 0.8rem; background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 3px 7px; }
.chip small { color: var(--muted); }
.chip .fz { color: var(--cook); }
.bank { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--bg); border-top: 1px solid var(--line);
  padding: 8px 12px calc(10px + env(safe-area-inset-bottom)); }
.bank h3 { font-size: 0.8rem; margin: 0 0 6px; color: var(--muted); font-weight: 600; display: flex; justify-content: space-between; }
.cards { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.card { flex: none; width: 148px; text-align: left; border: 1px solid var(--line); border-radius: 12px; background: var(--field); padding: 8px; }
.card.on { border: 2px solid var(--accent); background: var(--sel); }
.card .n { font-size: 0.85rem; font-weight: 600; display: block; }
.card .m { font-size: 0.75rem; color: var(--muted); display: block; margin-top: 3px; }
.card .tw { margin-top: 6px; display: flex; gap: 4px; align-items: center; font-size: 0.75rem; }
.card .tw button { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; width: 24px; height: 24px; padding: 0; }
.panel { border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; margin-top: 10px; font-size: 0.85rem; }
.panel h4 { margin: 0 0 6px; font-size: 0.9rem; }
.panel li { margin: 3px 0; }
.warn { color: var(--warn); }
.month { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; margin-top: 8px; }
.mdow { font-size: 0.7rem; color: var(--muted); text-align: center; }
.mday { min-height: 58px; border: 1px solid var(--line); border-radius: 8px; padding: 3px; font-size: 0.7rem; background: var(--field); text-align: left; }
.mday.other { opacity: 0.35; } .mday .k { font-weight: 650; display: block; } .mday .k.ok { color: var(--accent); } .mday .k.off { color: var(--warn); }
.mday .ck { color: var(--cook); }
.sheet { position: fixed; inset: 0; z-index: 20; background: #0007; display: flex; align-items: flex-end; }
.sheet > div { background: var(--bg); width: 100%; max-height: 80vh; overflow: auto; border-radius: 16px 16px 0 0; padding: 14px; }
.sheet button.opt { display: block; width: 100%; text-align: left; padding: 10px; margin: 4px 0; border: 1px solid var(--line); border-radius: 10px; background: var(--field); }
@media (min-width: 900px) {
  .layout { flex-direction: row-reverse; }
  .bank { position: sticky; top: 0; height: 100vh; width: 300px; flex: none; border-top: none; border-left: 1px solid var(--line); overflow-y: auto; }
  .cards { flex-direction: column; overflow: visible; }
  .card { width: 100%; cursor: grab; }
  .main { padding-bottom: 40px; }
  .days { grid-template-columns: repeat(7, minmax(0, 1fr)); align-items: start; }
  .slot { flex-direction: column; align-items: stretch; }
  .slot .sn { width: auto; }
  .mday { min-height: 96px; }
  .sheet { align-items: center; justify-content: center; } .sheet > div { max-width: 480px; border-radius: 16px; }
}
</style>
</head>
<body>
<div class="banner">MOCKUP with made-up numbers. Nothing is saved. Try it, then tell Claude what feels right or wrong.</div>
<div class="layout">
  <aside class="bank" id="bank"></aside>
  <div class="main" id="main"></div>
</div>
<div id="sheet"></div>
<script>
// ---------------- Fake data ----------------
const TARGET = { dayMin: 2000, dayMax: 3000 };
const RECIPES = {
  chili: { name: 'Sweet Potato Beef Chili', makes: 8, shop: ['3 lb ground beef 85/15', '1.75 lb sweet potatoes', '2 cans beans', '2 cans tomatoes', '1 onion', '2 bell peppers'] },
  chicken: { name: 'Mexican Chicken & Veg', makes: 8, shop: ['3–3.5 lb chicken thighs', '1 can black beans', '1 can chipotle in adobo', '5 carrots', '1 cup peas', '5 oz spinach'] },
  rice: { name: 'White rice', makes: 12, unit: 'cups cooked', shop: ['4 cups dry rice'] },
};
// Meal cards: kcal/protein per card; "tweak" lets you change the starch or scoops right on the card.
let meals = [
  { id: 'shake', name: 'Naked Mass shake', slot: 'breakfast', base: { kcal: 0, p: 0 }, tweak: { label: 'scoops', n: 3, step: 1, kcal: 225, p: 8.3 } },
  { id: 'chili', name: 'Chili', recipe: 'chili', base: { kcal: 607, p: 42 } },
  { id: 'chickrice', name: 'Chicken & veg + rice', recipe: 'chicken', starch: 'rice', base: { kcal: 333, p: 42 }, tweak: { label: 'cups rice', n: 1.75, step: 0.25, kcal: 225, p: 4.4 } },
  { id: 'chili-rice', name: 'Chili + rice', recipe: 'chili', starch: 'rice', base: { kcal: 607, p: 42 }, tweak: { label: 'cups rice', n: 0.5, step: 0.25, kcal: 225, p: 4.4 } },
  { id: 'yogurt', name: 'Greek yogurt + granola', base: { kcal: 350, p: 22 } },
  { id: 'chipotle', name: 'Chipotle bowl', base: { kcal: 1050, p: 60 } },
  { id: 'icecream', name: 'Ice cream, 1 cup', base: { kcal: 280, p: 5 } },
];
const kcalOf = (m) => m.base.kcal + (m.tweak ? m.tweak.n * m.tweak.kcal : 0);
const pOf = (m) => m.base.p + (m.tweak ? m.tweak.n * m.tweak.p : 0);
const tweakText = (m) => (m.tweak ? ` (${fmt(m.tweak.n)} ${m.tweak.label})` : '');
const fmt = (n) => { const w = Math.floor(n), f = n - w; const s = { 0.25: '¼', 0.5: '½', 0.75: '¾' }[f] || ''; return (w || !s ? w : '') + s; };

const SLOTS = [['breakfast', 'Breakfast'], ['lunch', 'Lunch'], ['dinner', 'Dinner'], ['snack', 'Snacks']];
const iso = (d) => d.toISOString().slice(0, 10);
const day0 = new Date(); day0.setHours(12, 0, 0, 0);
const addD = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return iso(d); };
const monday = (s) => { const d = new Date(s + 'T12:00:00'); return addD(s, -((d.getDay() + 6) % 7)); };
const label = (s) => new Date(s + 'T12:00:00').toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
const today = iso(day0);

// plan[date][slot] = [{ meal snapshot }]; cook[date] = [recipe keys]
const plan = {};
const cook = {};
const put = (date, slot, mealId) => {
  const m = meals.find((x) => x.id === mealId);
  ((plan[date] ||= {})[slot] ||= []).push({ id: Math.random(), mealId, name: m.name + tweakText(m), kcal: kcalOf(m), p: pOf(m), recipe: m.recipe });
};
// A sample week so there's something to look at.
const wk = monday(today);
for (let i = 0; i < 7; i++) put(addD(wk, i), 'breakfast', 'shake');
for (let i = 0; i < 5; i++) put(addD(wk, i), 'dinner', 'chickrice');
for (let i = 0; i < 4; i++) put(addD(wk, i), 'lunch', 'chili');
put(addD(wk, 5), 'dinner', 'chipotle');
put(addD(wk, 6), 'dinner', 'chili-rice');
put(addD(wk, 2), 'snack', 'icecream');
cook[addD(wk, -1)] = ['chili'];

// ---------------- State ----------------
let view = 'week', start = wk, monthOf = today.slice(0, 7), placing = null, dragId = null;

const dayTotals = (d) => {
  const t = { kcal: 0, p: 0 };
  for (const [s] of SLOTS) for (const e of plan[d]?.[s] || []) { t.kcal += e.kcal; t.p += e.p; }
  return t;
};
const lvl = (k) => (k < TARGET.dayMin || k > TARGET.dayMax ? 'off' : 'ok');

// Cook-day logic: each planned recipe meal is covered by the latest cook day of that recipe on or before it.
function cookCheck(from, to) {
  const out = {}; // recipe -> {planned, cooks:[{date, covers, freeze}], uncovered}
  const dates = Object.keys(plan).filter((d) => d >= from && d <= to).sort();
  for (const d of dates) for (const [s] of SLOTS) for (const e of plan[d]?.[s] || []) {
    if (!e.recipe) continue;
    const r = (out[e.recipe] ||= { planned: 0, cooks: {}, uncovered: 0 });
    r.planned++;
    const cd = Object.keys(cook).filter((c) => c <= d && cook[c].includes(e.recipe)).sort().pop();
    if (!cd) { r.uncovered++; continue; }
    const c = (r.cooks[cd] ||= { covers: 0, freeze: 0 });
    c.covers++;
    if ((new Date(d) - new Date(cd)) / 864e5 > 4) c.freeze++; // more than 4 days after cooking → freeze
  }
  return out;
}

// ---------------- Render ----------------
function render() {
  document.getElementById('bank').innerHTML = `
    <h3><span>Meal bank${placing ? ' · tap slots to place' : ' · tap a meal'}</span>${placing ? '<button onclick="setPlacing(null)" style="border:none;background:none;color:var(--accent)">Done</button>' : ''}</h3>
    <div class="cards">${meals.map((m) => `
      <div class="card ${placing === m.id ? 'on' : ''}" draggable="true" ondragstart="dragId='${m.id}'" onclick="setPlacing('${m.id}')">
        <span class="n">${m.name}</span>
        <span class="m">${Math.round(kcalOf(m))} kcal · ${Math.round(pOf(m))} g protein</span>
        ${m.tweak ? `<div class="tw" onclick="event.stopPropagation()">
          <button onclick="tweak('${m.id}',-1)">−</button> ${fmt(m.tweak.n)} ${m.tweak.label} <button onclick="tweak('${m.id}',1)">+</button></div>` : ''}
      </div>`).join('')}
    </div>`;
  const main = document.getElementById('main');
  main.className = 'main' + (placing ? ' placing' : '');
  main.innerHTML = header() + (view === 'week' ? week() : month()) + cookPanel();
}

function header() {
  const days = view === 'week' ? Array.from({ length: 7 }, (_, i) => addD(start, i)) : Object.keys(plan).filter((d) => d.startsWith(monthOf));
  const withFood = days.filter((d) => dayTotals(d).kcal > 0);
  const tot = withFood.reduce((a, d) => { const t = dayTotals(d); return { kcal: a.kcal + t.kcal, p: a.p + t.p }; }, { kcal: 0, p: 0 });
  const avg = withFood.length ? { kcal: tot.kcal / withFood.length, p: tot.p / withFood.length } : null;
  const title = view === 'week' ? `${label(start)} – ${label(addD(start, 6))}` : new Date(monthOf + '-15').toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
  return `<header>
    <div class="seg"><button class="${view === 'week' ? 'on' : ''}" onclick="view='week';render()">Week</button><button class="${view === 'month' ? 'on' : ''}" onclick="view='month';render()">Month</button></div>
    <div class="nav"><button onclick="step(-1)">‹ Prev</button><b>${title}</b><button onclick="step(1)">Next ›</button></div>
    <div class="totals">${avg ? `<span>${view === 'week' ? 'Week' : 'Month'} avg <span class="${lvl(avg.kcal)}">${Math.round(avg.kcal)} kcal</span> · ${Math.round(avg.p)} g protein /day</span><span>Total ${Math.round(tot.kcal).toLocaleString()} kcal over ${withFood.length} days</span>` : '<span>Nothing planned yet</span>'}</div>
    ${placing ? `<div class="hint">Placing <b>${meals.find((m) => m.id === placing).name}</b>: tap any slot (as many as you like), then Done.</div>` : ''}
  </header>`;
}

function week() {
  return `<div class="days">${Array.from({ length: 7 }, (_, i) => addD(start, i)).map((d) => {
    const t = dayTotals(d);
    return `<div class="day ${d === today ? 'today' : ''}">
      <div class="day-h"><b>${label(d)}</b>
        ${(cook[d] || []).map((r) => `<button class="cooktag" onclick="unCook('${d}','${r}')">🍳 ${RECIPES[r].name.split(' ').slice(-1)[0]}</button>`).join('')}
        <button class="cookbtn" onclick="askCook('${d}')">+ cook</button></div>
      <div class="day-h"><span class="t"><span class="${t.kcal ? lvl(t.kcal) : ''}">${Math.round(t.kcal)} kcal</span> · ${Math.round(t.p)} g protein</span></div>
      ${SLOTS.map(([s, n]) => `<div class="slot" onclick="slotTap('${d}','${s}')" ondragover="event.preventDefault();this.classList.add('dragover')" ondragleave="this.classList.remove('dragover')" ondrop="drop(event,'${d}','${s}')">
        <span class="sn">${n}</span><span class="es">${(plan[d]?.[s] || []).map((e) => `<span class="chip" onclick="event.stopPropagation();removeE('${d}','${s}',${e.id})">${e.name} <small>${Math.round(e.kcal)}</small></span>`).join('')}</span></div>`).join('')}
    </div>`;
  }).join('')}</div>`;
}

function month() {
  const first = monthOf + '-01';
  const next = addD(first, 31).slice(0, 7) + '-01'; // 1st of next month
  const cells = [];
  for (let d = monday(first); d < next || cells.length % 7; d = addD(d, 1)) cells.push(d);
  return `<div class="month">${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map((x) => `<div class="mdow">${x}</div>`).join('')}
    ${cells.map((c) => { const t = dayTotals(c); return `<button class="mday ${c.startsWith(monthOf) ? '' : 'other'}" onclick="start=monday('${c}');view='week';render()">
      ${+c.slice(8)} ${(cook[c] || []).length ? '<span class="ck">🍳</span>' : ''}${t.kcal ? `<span class="k ${lvl(t.kcal)}">${Math.round(t.kcal)}</span>${Math.round(t.p)} g` : ''}</button>`; }).join('')}</div>`;
}

function cookPanel() {
  const from = view === 'week' ? start : monthOf + '-01';
  const to = view === 'week' ? addD(start, 6) : monthOf + '-31';
  const chk = cookCheck(from, to);
  const keys = Object.keys(chk);
  const shopping = [];
  const rows = keys.map((r) => {
    const c = chk[r];
    const cooks = Object.entries(c.cooks).map(([d, x]) => {
      const batches = Math.ceil(x.covers / RECIPES[r].makes);
      for (let i = 0; i < batches; i++) shopping.push(...RECIPES[r].shop);
      return `🍳 ${label(d)}: covers ${x.covers} meal${x.covers > 1 ? 's' : ''}${batches > 1 ? ` (${batches} batches)` : ''}${x.freeze ? ` · <span class="fz">❄️ freeze ${x.freeze}</span>` : ''}`;
    });
    return `<li><b>${RECIPES[r].name}</b>: ${c.planned} planned. ${cooks.join('; ')}${c.uncovered ? ` <span class="warn">⚠ ${c.uncovered} with no cook day before them</span>` : ''}</li>`;
  });
  return `<div class="panel"><h4>Cooking for this ${view}</h4>
      ${keys.length ? `<ul style="padding-left:18px;margin:0">${rows.join('')}</ul>` : '<p>Nothing planned that needs cooking.</p>'}
      <p style="color:var(--muted);margin:6px 0 0">You set cook days (🍳 “+ cook” on a day). The app counts what each one has to cover and what to freeze.</p></div>
    <div class="panel"><h4>Shopping for these cook days</h4>${shopping.length ? `<ul style="padding-left:18px;margin:0">${[...new Set(shopping)].map((x) => `<li>☐ ${x}</li>`).join('')}</ul><p style="color:var(--muted);margin:6px 0 0">(Real app: combined amounts, by aisle, staples hidden.)</p>` : '<p>Add a cook day to see it.</p>'}</div>`;
}

// ---------------- Actions ----------------
function setPlacing(id) { placing = placing === id ? null : id; render(); }
function slotTap(d, s) { if (placing) { put(d, s, placing); render(); } }
function drop(ev, d, s) { ev.preventDefault(); if (dragId) put(d, s, dragId); dragId = null; render(); }
function removeE(d, s, id) { if (placing) return slotTap(d, s); plan[d][s] = plan[d][s].filter((e) => e.id !== id); render(); }
function tweak(id, dir) { const m = meals.find((x) => x.id === id); m.tweak.n = Math.max(0, m.tweak.n + dir * m.tweak.step); render(); }
function step(n) { if (view === 'week') start = addD(start, 7 * n); else { const d = new Date(monthOf + '-15'); d.setMonth(d.getMonth() + n); monthOf = iso(d).slice(0, 7); } render(); }
function unCook(d, r) { cook[d] = cook[d].filter((x) => x !== r); render(); }
function askCook(d) {
  document.getElementById('sheet').innerHTML = `<div class="sheet" onclick="closeSheet()"><div onclick="event.stopPropagation()">
    <b>Cook on ${label(d)}</b>${Object.entries(RECIPES).map(([k, r]) => `<button class="opt" onclick="addCook('${d}','${k}')">${r.name}</button>`).join('')}
    <button class="opt" onclick="closeSheet()">Cancel</button></div></div>`;
}
function addCook(d, r) { (cook[d] ||= []).includes(r) || cook[d].push(r); closeSheet(); render(); }
function closeSheet() { document.getElementById('sheet').innerHTML = ''; }
render();
</script>
</body>
</html>
